<html lang="en">
<head>

  <meta name="theme-color" content="#21150f">
  <meta name="description" content="Celebrate the grand opening of Rajya Rooftop. Spin the wheel to win special treats!">

  <title>Rajya Rooftop | Spin & Win</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    /* =========================================
       CSS VARIABLES & RESET
       ========================================= */
    :root {
      --clr-bg: #21150f;
      --clr-text: #fdfbf7;
      --clr-gold: #c5a059;
      --clr-gold-dim: rgba(197, 160, 89, 0.2);
      --clr-cream: #eaddc5;
      --clr-brown: #5c3c27;
      --clr-orange: #d96c3a;
      --clr-dark: #120b08;
      
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
      
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--clr-bg);
      color: var(--clr-text);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle noise texture overlay */
    .texture {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* =========================================
       LAYOUT & TYPOGRAPHY
       ========================================= */
    h1, h2, h3, .brand-symbol {
      font-family: var(--font-heading);
      font-weight: 700;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid var(--clr-gold-dim);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--clr-gold);
    }

    .brand h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      line-height: 1;
    }

    .brand p {
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: var(--clr-cream);
      margin-top: 0.25rem;
    }

    .brand-symbol {
      font-size: 2rem;
    }

    .opening-badge {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--clr-bg);
      background: var(--clr-gold);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-weight: 700;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4rem 1rem;
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--clr-gold);
      font-size: 0.8rem;
      letter-spacing: 4px;
      margin-bottom: 1.5rem;
    }

    .eyebrow span {
      height: 1px;
      width: 40px;
      background: var(--clr-gold);
    }

    .hero h2 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero h2 em {
      color: var(--clr-gold);
      font-style: normal;
    }

    .description {
      color: var(--clr-cream);
      max-width: 400px;
      margin-bottom: 3rem;
      font-size: 1.1rem;
    }

    /* =========================================
       WHEEL COMPONENT
       ========================================= */
    .wheel-area {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin: 0 auto 3rem;
    }

    .wheel-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, var(--clr-gold-dim) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid var(--clr-text);
      z-index: 5;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
    }

    .wheel-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid var(--clr-gold);
      position: relative;
      box-shadow: 0 0 30px rgba(197, 160, 89, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }
